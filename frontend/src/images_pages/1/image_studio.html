</div>
<p class="font-headline-md text-headline-md text-on-surface mb-2">Upload an Image</p>

<span class="font-label-caps text-label-caps">Gallery</span>
</a>
<!-- Profile (Inactive) -->

<span class="material-symbols-outlined text-2xl mb-1">person</span>
<span class="font-label-caps text-label-caps">Profile</span>

<script>
        // Simple interaction for style selection
        document.querySelectorAll('.snap-start').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const currentActive = document.querySelector('.snap-start .border-primary');
                if (currentActive) {
                    currentActive.classList.remove('border-primary', 'shadow-[0_0_15px_rgba(208,188,255,0.4)]');
                    currentActive.classList.add('border-transparent');
                    currentActive.parentElement.classList.add('opacity-60');
                    currentActive.parentElement.classList.remove('opacity-100');
                    currentActive.nextElementSibling.classList.replace('text-primary', 'text-on-surface-variant');
                    
                    // Remove gradient overlay from previous
                    const gradient = currentActive.querySelector('.bg-gradient-to-t');
                    if(gradient) gradient.remove();
                }

                const targetImgContainer = e.currentTarget.querySelector('.glass-panel');
                targetImgContainer.classList.remove('border-transparent');
                targetImgContainer.classList.add('border-primary', 'shadow-[0_0_15px_rgba(208,188,255,0.4)]');
                e.currentTarget.classList.remove('opacity-60');
                e.currentTarget.classList.add('opacity-100');
                e.currentTarget.querySelector('span').classList.replace('text-on-surface-variant', 'text-primary');

                // Add gradient overlay to new active
                if(!targetImgContainer.querySelector('.bg-gradient-to-t')){
                    targetImgContainer.insertAdjacentHTML('afterbegin', '<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>');
                }
            });
        });
    </script>
