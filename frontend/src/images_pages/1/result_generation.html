<style>

            color: #dae2fd;
        }

            background: rgba(255, 255, 255, 0.08);

        }

            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(251, 171, 255, 0.15) 0%, rgba(251, 171, 255, 0) 70%);

<body class="min-h-screen pb-[90px] pt-20 px-margin-page relative overflow-x-hidden">
<!-- Ambient Orbs -->
<div class="ambient-orb-primary top-0 left-[-50px]"></div>
<div class="ambient-orb-secondary top-[40%] right-[-100px]"></div>

<span class="px-3 py-1 rounded-full border border-secondary text-secondary font-label-caps text-label-caps bg-surface-container-highest/50 backdrop-blur-md">Destiny</span>

</div>

</div>
