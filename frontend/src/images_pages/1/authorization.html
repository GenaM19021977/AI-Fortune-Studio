            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmerEffect 3s infinite linear;

<script>
        // Simple subtle parallax for background orbs on mouse move (if on desktop)
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const orbs = document.querySelectorAll('.mix-blend-screen');
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                orbs[0].style.transform = `translate(${x * 20}px, ${y * 20}px)`;
                orbs[1].style.transform = `translate(${x * -30}px, ${y * -30}px)`;
            }
        });
    </script>
