<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Fortune Studio - Initiate Your Journey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&amp;family=Inter:wght@400..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#2d3449",
                      "primary": "#d0bcff",
                      "outline-variant": "#494454",
                      "surface-container-highest": "#2d3449",
                      "on-primary": "#3c0091",
                      "surface-tint": "#d0bcff",
                      "surface-dim": "#0b1326",
                      "primary-fixed": "#e9ddff",
                      "primary-container": "#a078ff",
                      "outline": "#958ea0",
                      "surface-container-low": "#131b2e",
                      "on-secondary-fixed-variant": "#7c008e",
                      "on-secondary-container": "#ffd8fd",
                      "on-secondary": "#580065",
                      "tertiary-container": "#009ada",
                      "surface-container": "#171f33",
                      "tertiary": "#89ceff",
                      "primary-fixed-dim": "#d0bcff",
                      "on-background": "#dae2fd",
                      "inverse-on-surface": "#283044",
                      "background": "#0b1326",
                      "on-surface-variant": "#cbc3d7",
                      "tertiary-fixed": "#c9e6ff",
                      "surface-container-lowest": "#060e20",
                      "on-primary-fixed": "#23005c",
                      "error-container": "#93000a",
                      "on-primary-fixed-variant": "#5516be",
                      "on-tertiary": "#00344d",
                      "on-secondary-fixed": "#36003e",
                      "on-tertiary-fixed-variant": "#004c6e",
                      "secondary": "#fbabff",
                      "tertiary-fixed-dim": "#89ceff",
                      "secondary-fixed": "#ffd6fd",
                      "on-tertiary-container": "#002d43",
                      "surface-bright": "#31394d",
                      "error": "#ffb4ab",
                      "on-tertiary-fixed": "#001e2f",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed-dim": "#fbabff",
                      "on-primary-container": "#340080",
                      "surface-container-high": "#222a3d",
                      "on-error": "#690005",
                      "surface": "#0b1326",
                      "secondary-container": "#ae05c6",
                      "on-surface": "#dae2fd",
                      "inverse-surface": "#dae2fd",
                      "inverse-primary": "#6d3bd7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "0.5rem",
                      "stack-xl": "2.5rem",
                      "stack-lg": "1.5rem",
                      "margin-page": "1.25rem",
                      "stack-md": "1rem",
                      "gutter-grid": "1rem"
              },
              "fontFamily": {
                      "headline-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "mono-label": ["Geist"],
                      "headline-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-caps": ["Geist"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "mono-label": ["13px", {"lineHeight": "18px", "fontWeight": "500"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

            }
          }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen relative overflow-hidden flex flex-col">
<!-- Ambient Orbs (Glassmorphism Depth) -->
<div class="fixed top-[-10%] left-[-20%] w-[70vw] h-[70vw] bg-primary/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed bottom-[10%] right-[-20%] w-[60vw] h-[60vw] bg-secondary/15 rounded-full blur-[120px] pointer-events-none"></div>
<main class="flex-1 flex flex-col px-margin-page pt-12 pb-8 z-10 relative max-w-md mx-auto w-full">
<!-- Header & Progress -->
<header class="mb-stack-xl flex flex-col gap-4">
<div class="flex items-center gap-2">
<div class="flex gap-1">
<div class="w-8 h-1 bg-primary rounded-full shadow-[0_0_10px_rgba(208,188,255,0.5)]"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
</div>
<span class="font-mono-label text-mono-label text-primary uppercase ml-2 tracking-widest">Identity Setup</span>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile bg-clip-text text-transparent bg-gradient-to-r from-on-surface to-on-surface-variant mb-2">Initiate Your Journey</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">The oracle awaits. Define your digital essence to proceed into the studio.</p>
</div>
</header>
<!-- Glassmorphic Form Card -->
<div class="bg-white/[0.08] border-t border-l border-white/[0.15] backdrop-blur-[24px] rounded-xl p-6 flex flex-col gap-stack-lg mb-auto shadow-[0_8px_32px_0_rgba(0,0,0,0.3)]">
<!-- Oracle Name Input -->
<div class="relative group">
<input class="peer w-full bg-surface-container-highest/40 backdrop-blur-md border-0 border-b-2 border-surface-variant text-on-surface font-body-lg text-body-lg px-4 pt-6 pb-2 rounded-t-lg focus:ring-0 focus:border-primary transition-all focus:bg-surface-container-highest/60 outline-none" id="oracleName" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 font-body-lg text-body-lg text-on-surface-variant transition-all peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-focus:font-mono-label peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:text-primary peer-[:not(:placeholder-shown)]:font-mono-label pointer-events-none" for="oracleName">Choose Your Oracle Name</label>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant peer-focus:text-primary transition-colors pointer-events-none" style="font-variation-settings: 'FILL' 0;">badge</span>
</div>
<!-- Email Input -->
<div class="relative group">
<input class="peer w-full bg-surface-container-highest/40 backdrop-blur-md border-0 border-b-2 border-surface-variant text-on-surface font-body-lg text-body-lg px-4 pt-6 pb-2 rounded-t-lg focus:ring-0 focus:border-primary transition-all focus:bg-surface-container-highest/60 outline-none" id="email" placeholder=" " type="email"/>
<label class="absolute left-4 top-4 font-body-lg text-body-lg text-on-surface-variant transition-all peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary peer-focus:font-mono-label peer-[:not(:placeholder-shown)]:top-1 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:text-primary peer-[:not(:placeholder-shown)]:font-mono-label pointer-events-none" for="email">Email (Optional)</label>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant peer-focus:text-primary transition-colors pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
</div>
<!-- Actions -->
<div class="mt-stack-xl flex flex-col gap-stack-md pt-4">
<button class="w-full rounded-full bg-gradient-to-r from-primary to-secondary py-4 px-6 flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(208,188,255,0.3)] hover:opacity-90 hover:shadow-[0_0_25px_rgba(251,171,255,0.4)] transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">send</span>
<span class="font-headline-md text-headline-md text-on-primary">Register with Telegram</span>
</button>
<div class="text-center mt-2">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-1 group" href="#">
                    Already a member? 
                    <span class="font-bold underline decoration-primary/30 group-hover:decoration-primary underline-offset-4 transition-colors">Login</span>
</a>
</div>
</div>
</main>
</body></html>
