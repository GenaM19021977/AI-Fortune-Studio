<script>
        // Web Audio API Sound System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playMysticSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'magic') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 1.5);
            } else if (type === 'soft') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Segmented control logic
        const polarityButtons = document.querySelectorAll('.flex.p-1.bg-surface-container-lowest\\/60 button');
        polarityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                polarityButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container');
                    b.classList.add('text-on-surface-variant');
                });
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                btn.classList.remove('text-on-surface-variant');
            });
        });

        // Form submission effect
        document.getElementById('manifest-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span><span class="font-bold">SUMMONING...</span>';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span><span class="font-bold">MANIFESTED</span>';
                btn.classList.replace('bg-primary-container', 'bg-secondary-container');
                btn.classList.replace('text-on-primary-container', 'text-on-secondary-container');
            }, 2000);
        });
    </script>

}
.mystic-particle {

<script>
(function() {
  function createParticle(x, y) {
    const particle = document.createElement('span');
    particle.className = 'mystic-particle material-symbols-outlined';
    particle.textContent = 'star';
    
    const dx = (Math.random() - 0.5) * 150 + 'px';
    const dy = (Math.random() - 0.5) * 150 + 'px';
    
    particle.style.left = x + 'px';
    particle.style.top = y + 'px';
    particle.style.setProperty('--dx', dx);
    particle.style.setProperty('--dy', dy);
    
    document.body.appendChild(particle);
    setTimeout(() => particle.remove(), 800);
  }

  function handleParticleClick(e) {
    const x = e.clientX;
    const y = e.clientY;
    for (let i = 0; i < 18; i++) {
      createParticle(x, y);
    }
  }

  const selectors = [
    '#manifest-form button[type="submit"]', // SCREEN_12
    '#magic-btn', // SCREEN_7
    'main > div.space-y-4 > button', // SCREEN_13
    '.gold-glow button', // SCREEN_9
    '.gold-gradient.rounded-full', // SCREEN_16
    '.gold-gradient-btn' // SCREEN_15
  ];

  selectors.forEach(selector => {
    const btn = document.querySelector(selector);
    if (btn) {
      btn.classList.add('cursor-pointer');
      btn.addEventListener('mousedown', handleParticleClick);
    }
  });
})();
</script></body></html>
