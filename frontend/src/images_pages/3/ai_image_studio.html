</button><script>
(function() {
  const btn = document.getElementById('magic-btn');
  if (!btn) return;

  btn.addEventListener('click', (e) => {
    const rect = btn.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    for (let i = 0; i < 12; i++) {
      const particle = document.createElement('span');
      particle.className = 'material-symbols-outlined absolute pointer-events-none text-primary z-50';
      particle.style.fontVariationSettings = "'FILL' 1";
      particle.style.fontSize = '14px';
      particle.textContent = 'star';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      
      const angle = (Math.PI * 2 / 12) * i;
      const velocity = 50 + Math.random() * 50;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;

      btn.appendChild(particle);

      const animation = particle.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 800,
        easing: 'cubic-bezier(0, .9, .57, 1)'
      });

      animation.onfinish = () => particle.remove();
    }
  });
})();
</script>

<script>
        // Web Audio API Sound System
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playMysticSound(type) {
            initAudio();
            const now = audioCtx.currentTime;
            
            if (type === 'magic') {
                // Magical resonant chime
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.1, now + 0.1 + i*0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 2);
                });
            } else if (type === 'soft') {
                // Subtle ping
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Simple Interaction Logic
        const magicBtn = document.getElementById('magic-btn');
        const dropZone = document.getElementById('drop-zone');
        
        magicBtn.addEventListener('click', () => {
            magicBtn.innerHTML = `
                <span class="material-symbols-outlined animate-spin">sync</span>
                <span class="font-label-caps text-sm tracking-widest uppercase font-bold">Channelling Energy...</span>
            `;
            magicBtn.style.opacity = '0.8';
            
            setTimeout(() => {
                magicBtn.innerHTML = `
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">magic_button</span>
                    <span class="font-label-caps text-sm tracking-widest uppercase font-bold">Magic Transform</span>
                `;
                magicBtn.style.opacity = '1';
            }, 3000);
        });

        dropZone.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    dropZone.querySelector('p:first-of-type').textContent = file.name;
                    dropZone.classList.add('border-primary/60');
                    dropZone.querySelector('.material-symbols-outlined').textContent = 'check_circle';
                    dropZone.querySelector('.material-symbols-outlined').classList.add('text-secondary-fixed-dim');
                }
            };
            input.click();
        });

        // Hover effect for background orb tracking
        document.addEventListener('mousemove', (e) => {
            const orb = document.querySelector('.bg-orb:nth-child(2)');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            orb.style.transform = `translate(${x * 50}px, ${y * 50}px)`;
        });
    </script>
</body></html>
