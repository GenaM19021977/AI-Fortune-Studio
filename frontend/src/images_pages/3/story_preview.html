            }

<script>
    // Simple script to re-trigger animation on background selection (mock)
    document.querySelectorAll('section button').forEach(btn => {
        btn.addEventListener('click', () => {
            const bgElement = document.querySelector('.animate-mystic-reveal');
            
            // Remove animation
            bgElement.classList.remove('animate-mystic-reveal');
            
            // Trigger reflow
            void bgElement.offsetWidth;
            
            // Add animation back
            bgElement.classList.add('animate-mystic-reveal');
        });
    });
</script>
