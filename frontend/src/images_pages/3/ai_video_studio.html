    <script>
            // Micro-interaction for buttons
            document.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', () => {
                    const originalScale = button.style.transform;
                    button.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        button.style.transform = originalScale;
                    }, 100);
                });
            });
    
            // Simple timeline progress simulation
            let progress = 65;
            const progressEl = document.querySelector('.timeline-progress');
            const progressText = document.querySelector('.text-primary.font-mono');
            
            setInterval(() => {
                if (progress < 99) {
                    progress += Math.random() * 0.5;
                    if(progressEl) progressEl.style.width = `${progress}%`;
                    if(progressText) progressText.innerText = `${Math.floor(progress)}%`;
                }
            }, 1000);
        </script>
    
    
    <script>
    (function() {
      const btn = document.getElementById('generate-video-btn');
      if (!btn) return;
    
      btn.addEventListener('click', (e) => {
        const rect = btn.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        createParticles(centerX, centerY);
      });
    
      function createParticles(x, y) {
        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '9999';
        document.body.appendChild(canvas);
    
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    
        const particles = [];
        for (let i = 0; i < 30; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            size: Math.random() * 4 + 2,
            life: 1,
            color: Math.random() > 0.5 ? '#f2ca50' : '#d4af37'
          });
        }
    
        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          particles.forEach(p => {
            if (p.life > 0) {
              alive = true;
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.1; // gravity
              p.life -= 0.02;
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              // Add glow
              ctx.shadowBlur = 10;
              ctx.shadowColor = p.color;
            }
          });
    
          if (alive) {
            requestAnimationFrame(animate);
          } else {
            canvas.remove();
          }
        }
        animate();
      }
    })();
