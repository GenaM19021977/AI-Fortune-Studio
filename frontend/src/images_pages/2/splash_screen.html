<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&amp;family=JetBrains+Mono:wght@500&amp;family=Sora:wght@700;800&amp;display=swap" rel="stylesheet"/>

<style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); filter: drop-shadow(0 0 20px rgba(189, 0, 255, 0.4)); }
            50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 40px rgba(236, 178, 255, 0.8)); }
        }
        @keyframes float-particle {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
        @keyframes load-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .aurora-bg {
            background: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.15) 0%, rgba(19, 19, 24, 1) 70%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface w-full min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md">
<!-- Deep Aurora Background -->
<div class="absolute inset-0 aurora-bg z-0"></div>
<!-- Floating Particles Container -->
<div class="absolute inset-0 z-10 pointer-events-none" id="particles"></div>
<!-- Main Content Canvas -->
<main class="relative z-20 flex flex-col items-center justify-center w-full max-w-[390px] px-container-padding h-full min-h-screen">
<!-- Logo Container -->
<div class="flex flex-col items-center justify-center mb-12">
<!-- 3D Logo Representation -->
<div class="w-32 h-32 md:w-48 md:h-48 mb-8 relative" style="animation: pulse-glow 3s infinite ease-in-out;">
<img class="w-full h-full object-contain filter drop-shadow-[0_0_30px_rgba(189,0,255,0.6)]" data-alt="A highly detailed 3D rendered logo of a mystical, futuristic oracle eye or crystalline structure. The logo is floating in a dark void. It has a high-fidelity glassmorphism aesthetic with refractive depth, glowing intensely with a vibrant cyberpunk purple (BD00FF) and cyan core. The lighting is dramatic, highlighting the sleek, premium AI craftsmanship." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_CIq7w8MuLmrISVDsWBg5rN55Xb4GPqfCoe9prC7Lwd891t49wwnjFeVtp7L8J4rYXuBK7yx3LgDMUfWW-Z5SfNwSqobkhnEq9571_y9Pg_n4tAIAYGrpBAmmOD7a2PYsKX0TFZX_tosdzjcZQXrwMvDjjt44Pb8rW2r3kmIWGb-hRM5rN8BskxwPE_ntOT22Z0ZBAxbxkI16oMuRLkUwh97EW0RD7n9waq_yQjpuHhPqte4HPmzKw264ZXsDyf3t7O1IR0RQXIY"/>
</div>
<!-- Brand Name -->
<h1 class="font-display-xl text-display-xl text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary-fixed-dim text-center drop-shadow-[0_0_15px_rgba(236,178,255,0.5)] mb-2">
                AI Fortune Studio
            </h1>
<p class="font-label-mono text-label-mono text-outline tracking-[0.2em] uppercase">
                The Oracle in the Machine
            </p>
</div>
<!-- Loading Progress -->
<div class="w-full max-w-[280px] absolute bottom-24 flex flex-col items-center gap-4">
<div class="w-full h-1.5 glass-panel rounded-full overflow-hidden relative shadow-[0_0_10px_rgba(189,0,255,0.2)]">
<div class="absolute top-0 left-0 h-full bg-gradient-to-r from-primary-container to-secondary-container rounded-full" style="animation: load-bar 4s cubic-bezier(0.4, 0, 0.2, 1) forwards; box-shadow: 0 0 10px rgba(236, 178, 255, 0.8);"></div>
</div>
<span class="font-label-mono text-label-mono text-primary-fixed-dim animate-pulse">Initializing Neural Link...</span>
</div>
</main>
<script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute rounded-full bg-primary-fixed';
            
            // Random properties
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 2;
            const opacity = Math.random() * 0.5 + 0.1;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.top = `${top}%`;
            particle.style.opacity = opacity;
            particle.style.boxShadow = `0 0 ${size * 2}px #ecb2ff`;
            
            particle.style.animation = `float-particle ${duration}s ease-in infinite ${delay}s`;
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body></html>
