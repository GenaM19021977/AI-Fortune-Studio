<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AI Fortune Studio - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&amp;family=Hanken+Grotesk:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-lowest": "#0e0e13",
                        "outline": "#9d8ba0",
                        "surface-tint": "#ecb2ff",
                        "on-secondary-fixed": "#002022",
                        "error-container": "#93000a",
                        "primary": "#ecb2ff",
                        "on-secondary-container": "#00686f",
                        "surface-container-highest": "#35343a",
                        "primary-fixed": "#f8d8ff",
                        "surface-container-high": "#2a292f",
                        "inverse-on-surface": "#303036",
                        "on-primary-fixed-variant": "#74009f",
                        "tertiary-container": "#e7006e",
                        "surface-dim": "#131318",
                        "on-surface": "#e4e1e9",
                        "on-primary": "#520071",
                        "on-error": "#690005",
                        "on-surface-variant": "#d4c0d7",
                        "secondary-fixed": "#7df4ff",
                        "on-error-container": "#ffdad6",
                        "background": "#131318",
                        "secondary-fixed-dim": "#00dbe9",
                        "on-secondary": "#00363a",
                        "surface-variant": "#35343a",
                        "primary-container": "#bd00ff",
                        "surface-bright": "#39383e",
                        "on-secondary-fixed-variant": "#004f54",
                        "on-background": "#e4e1e9",
                        "secondary": "#d3fbff",
                        "on-tertiary-fixed": "#3f0019",
                        "on-primary-fixed": "#320047",
                        "tertiary-fixed": "#ffd9e0",
                        "on-tertiary-container": "#ffffff",
                        "inverse-primary": "#9900cf",
                        "on-tertiary-fixed-variant": "#8f0041",
                        "on-primary-container": "#ffffff",
                        "inverse-surface": "#e4e1e9",
                        "secondary-container": "#00eefc",
                        "surface-container": "#1f1f25",
                        "on-tertiary": "#66002c",
                        "outline-variant": "#514255",
                        "surface": "#131318",
                        "primary-fixed-dim": "#ecb2ff",
                        "surface-container-low": "#1b1b20",
                        "tertiary-fixed-dim": "#ffb1c3",
                        "tertiary": "#ffb1c3",
                        "error": "#ffb4ab"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "4px",
                        "container-padding": "20px",
                        "stack-gap": "16px",
                        "glass-padding": "24px"
                    },
                    fontFamily: {
                        "label-mono": ["JetBrains Mono"],
                        "headline-lg": ["Sora"],
                        "display-xl": ["Sora"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Sora"]
                    },
                    fontSize: {
                        "label-mono": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "500" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "display-xl": ["48px", { lineHeight: "52px", letterSpacing: "-0.04em", fontWeight: "800" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "34px", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(27, 27, 32, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        .btn-glow {
            box-shadow: 0 0 20px rgba(189, 0, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .btn-glow:active {
            transform: scale(0.96);
            box-shadow: 0 0 10px rgba(189, 0, 255, 0.6);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .btn-glass:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.1);
        }

        .bg-aurora {
            background: radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 238, 252, 0.1) 0%, transparent 50%);
            animation: aurora-shift 15s ease-in-out infinite alternate;
        }

        @keyframes aurora-shift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen relative overflow-hidden flex flex-col justify-center">
<!-- Abstract Background Image Layer -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full opacity-60" data-alt="A dark cyberpunk inspired abstract background. Deep black space filled with soft, glowing, out-of-focus volumetric lights in vibrant purple (primary-container) and bright cyan (secondary-container). The shapes are organic, liquid-like, and highly blurred, creating a sense of deep, infinite void behind a thick pane of refractive glass. Premium, cinematic lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuArPEkbHIQayvFP1bymCduiQ9gcvf7BarJxr26m3eFEJe4ZbLWmDhJ6yHDOk4cGca_L0xgxEOftrUhdesjBFATn2BFpiLTLAibuYzVPIiq8q91wa3AuRfQ7xT6gm2B4qPQdhc76fsQBnkawg9_G8DUMYTexQbxVGoVyyRbN2qFxQRMgevA0xbil3hCZnXZ5JEySyzAyqOeUSys46ogKUitHYaPwE8QtFSA7QaQaY4gmG5yc39Ij6wnfbZcBj158VjjoZnizyc6mUX8')"></div>
<div class="absolute inset-0 bg-background/40 backdrop-blur-3xl bg-aurora"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[390px] mx-auto px-container-padding flex flex-col items-center h-[884px] py-12">
<!-- Top Spacer -->
<div class="flex-grow flex items-center justify-center w-full">
<!-- Glass Panel -->
<div class="glass-panel rounded-xl p-glass-padding w-full flex flex-col items-center text-center space-y-6">
<!-- Brand Icon/Logo Placeholder -->
<div class="w-16 h-16 rounded-full bg-gradient-to-tr from-primary-container to-secondary-container p-[1px] shadow-[0_0_20px_rgba(189,0,255,0.3)]">
<div class="w-full h-full bg-surface-container-highest rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                            auto_awesome
                        </span>
</div>
</div>
<!-- Welcome Message -->
<div class="space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-transparent bg-clip-text bg-gradient-to-r from-primary-fixed to-secondary-fixed">
                        Welcome to the Future of Content
                    </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                        Experience the next generation of AI-driven creation and discovery.
                    </p>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full flex flex-col gap-stack-gap mt-auto pb-4">
<!-- Primary Button -->
<button class="w-full h-14 rounded-lg bg-gradient-to-r from-[#FFD700] via-primary-container to-tertiary-container text-white font-label-mono text-label-mono uppercase tracking-wider flex items-center justify-center gap-2 btn-glow relative overflow-hidden group">
<span class="relative z-10">Войти через Telegram</span>
<span class="material-symbols-outlined relative z-10 text-[18px]" style="font-variation-settings: 'FILL' 1;">
                    star
                </span>
<!-- Inner shimmer effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
</button>
<!-- Secondary Button -->
<button class="w-full h-14 rounded-lg btn-glass text-on-surface font-label-mono text-label-mono uppercase tracking-wider flex items-center justify-center gap-2">
<span>Продолжить как гость</span>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">
                    arrow_forward
                </span>
</button>
<!-- Legal Links -->
<div class="flex justify-center items-center gap-4 mt-2">
<a class="font-label-mono text-[10px] text-outline hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline-variant text-[10px]">•</span>
<a class="font-label-mono text-[10px] text-outline hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</main>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
</body></html>
