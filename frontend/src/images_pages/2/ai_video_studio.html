            left: 50%;

            height: 150vw;

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(31, 31, 37, 0.4); /* surface-container with opacity */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid transparent;
            background-clip: padding-box;
            position: relative;
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
        }

        .glass-button {
            background: rgba(31, 31, 37, 0.3);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .primary-gradient-btn {
            background: linear-gradient(135deg, #bd00ff 0%, #e7006e 100%); /* primary-container to tertiary-container */
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }

        .text-gradient {
            background: linear-gradient(90deg, #ecb2ff, #00dbe9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
