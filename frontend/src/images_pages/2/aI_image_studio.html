        body {

            top: 0;

            width: 100vw;
            height: 100vh;
            z-index: -1;
            background:

            filter: blur(60px);
            pointer-events: none;

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(31, 31, 37, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid;
            border-image-source: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            border-image-slice: 1;
        }

        .glass-card {
            background: rgba(53, 52, 58, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid transparent;
            border-radius: 0.75rem;
        }

        /* Hide scrollbar for horizontal lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Glow Effects */
        .glow-primary {
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }
        
        .image-upload-glow {
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, rgba(189, 0, 255, 0.5), rgba(0, 238, 252, 0.5), rgba(189, 0, 255, 0.5));
            border-radius: inherit;
            z-index: -1;
            filter: blur(10px);
            opacity: 0.7;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; filter: blur(8px); }
            100% { opacity: 0.8; filter: blur(12px); }
        }
