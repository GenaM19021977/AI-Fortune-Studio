<style>
        .glass-panel {
            background: rgba(31, 31, 37, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.2);
        }
        
        .input-glass {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .input-glass:focus-within {
            border-color: rgba(236, 178, 255, 0.5);
            box-shadow: 0 0 15px rgba(236, 178, 255, 0.2);
        }

        .input-glass input, .input-glass select, .input-glass textarea {
            background: transparent;
            border: none;
            color: var(--on-surface);
            outline: none;
        }

        .input-glass input::placeholder, .input-glass textarea::placeholder {
            color: var(--outline);
        }

        .btn-glow {
            background: linear-gradient(135deg, #ecb2ff 0%, #ffb1c3 100%);
            box-shadow: 0 0 20px rgba(236, 178, 255, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .btn-glow:active::after {
            opacity: 1;
        }

        .bg-aurora {
            background: radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 238, 252, 0.1) 0%, transparent 50%);
            animation: auroraPulse 10s ease-in-out infinite alternate;
        }

        @keyframes auroraPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
        
        /* Pulse animation for the main button */
        @keyframes vibrate {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(236, 178, 255, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(236, 178, 255, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(236, 178, 255, 0.4); }
        }
        
        .animate-vibrate {
            animation: vibrate 2s infinite ease-in-out;
        }
    </style>
<style>

<body class="bg-background text-on-surface font-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Aurora -->
<div class="fixed inset-0 z-0 bg-aurora pointer-events-none"></div>
<!-- TopAppBar Container -->

<div class="flex justify-between items-center px-container-padding py-4 w-full">
<div class="flex items-center gap-3 active:scale-95 transition-transform hover:opacity-80">
<div class="w-10 h-10 rounded-full overflow-hidden border border-white/20 glass-panel">
<img alt="User Profile Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZJYxlwGDaLqNLEVfjZVKOPjtiQHwSISeXpuT19KFmWFUw-4aYdkGBMZlVNqXZxGEc36z1H7q0yqTYpnwJvrVzFA2lQ6tL-G3CskaXDaR2GzJABKmUYFA2mSFPl1g72-AIB1v3QG2vG1CKPl3fvtpOX7VWEjXnjalHRFc45g4bAGmA9S0NWkyo4i_P510dH9gxJI7UPfKcPCgyIK6Fjvi8y-fEdRKF50lAI_7kfbSqkZWf_lar88i0QdkG7cO_5rVPO5Rj8FuSMMg"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">AI Fortune Studio</h1>
</div>
<button class="active:scale-95 transition-transform hover:opacity-80 text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">military_tech</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 pt-[88px] pb-[100px] px-container-padding max-w-md mx-auto w-full min-h-screen flex flex-col gap-stack-gap">
<!-- Header Section -->
<div class="mb-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Create Fortune</h2>
<p class="font-body-md text-on-surface-variant">Configure the parameters for your predictive reading.</p>
</div>
<!-- Form Container (Glass Panel) -->
<form class="glass-panel rounded-xl p-glass-padding flex flex-col gap-stack-gap shadow-[0_8px_32px_rgba(0,0,0,0.2)]">
<!-- Personal Info Section -->
<div class="flex flex-col gap-unit">
<label class="font-label-mono text-label-mono text-primary uppercase tracking-wider pl-1">Target Individual</label>
<div class="input-glass rounded-lg flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline mr-3">person</span>
<input class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0" placeholder="Name" required="" type="text"/>
</div>
<div class="grid grid-cols-2 gap-3 mt-2">
<div class="input-glass rounded-lg flex items-center px-4 py-3 relative">
<select class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 appearance-none cursor-pointer">
<option class="bg-surface-container text-outline" disabled="" selected="" value="">Gender</option>
<option class="bg-surface-container" value="male">Male</option>
<option class="bg-surface-container" value="female">Female</option>
<option class="bg-surface-container" value="other">Other</option>
</select>
<span class="material-symbols-outlined text-outline absolute right-3 pointer-events-none">expand_more</span>
</div>
<div class="input-glass rounded-lg flex items-center px-4 py-3">
<input class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 text-sm" placeholder="DOB" type="date"/>
</div>
</div>
</div>
<div class="w-full h-px bg-white/5 my-2"></div>
<!-- Context Section -->
<div class="flex flex-col gap-unit">
<label class="font-label-mono text-label-mono text-primary uppercase tracking-wider pl-1">Context &amp; Reading</label>
<div class="input-glass rounded-lg flex items-center px-4 py-3 relative">
<span class="material-symbols-outlined text-outline mr-3">category</span>
<select class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 appearance-none cursor-pointer">
<option class="bg-surface-container text-outline" disabled="" selected="" value="">Category</option>
<option class="bg-surface-container" value="love">Love &amp; Relationships</option>
<option class="bg-surface-container" value="career">Career &amp; Finance</option>
<option class="bg-surface-container" value="health">Health &amp; Wellness</option>
<option class="bg-surface-container" value="general">General Future</option>
</select>
<span class="material-symbols-outlined text-outline absolute right-3 pointer-events-none">expand_more</span>
</div>
<div class="input-glass rounded-lg flex items-center px-4 py-3 mt-2 relative">
<span class="material-symbols-outlined text-outline mr-3">auto_awesome</span>
<select class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 appearance-none cursor-pointer">
<option class="bg-surface-container text-outline" disabled="" selected="" value="">AI-Style</option>
<option class="bg-surface-container" value="mystical">Mystical Oracle</option>
<option class="bg-surface-container" value="cyberpunk">Cyberpunk Prophet</option>
<option class="bg-surface-container" value="direct">Direct &amp; Pragmatic</option>
<option class="bg-surface-container" value="poetic">Poetic &amp; Metaphorical</option>
</select>
<span class="material-symbols-outlined text-outline absolute right-3 pointer-events-none">expand_more</span>
</div>
<div class="input-glass rounded-lg flex items-start px-4 py-3 mt-2">
<span class="material-symbols-outlined text-outline mr-3 mt-1">interests</span>
<textarea class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 resize-none" placeholder="Specific Interests or Questions..." rows="2"></textarea>
</div>
</div>
<div class="w-full h-px bg-white/5 my-2"></div>
<!-- Output Settings -->
<div class="flex flex-col gap-unit">
<label class="font-label-mono text-label-mono text-primary uppercase tracking-wider pl-1">Output Settings</label>
<div class="grid grid-cols-2 gap-3">
<div class="input-glass rounded-lg flex items-center px-4 py-3 relative">
<select class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 appearance-none cursor-pointer text-sm">
<option class="bg-surface-container" value="en">English</option>
<option class="bg-surface-container" selected="" value="ru">Русский</option>
<option class="bg-surface-container" value="es">Español</option>
</select>
<span class="material-symbols-outlined text-outline absolute right-2 pointer-events-none text-sm">language</span>
</div>
<div class="input-glass rounded-lg flex items-center px-4 py-3 relative">
<select class="w-full font-body-md text-on-surface bg-transparent border-none focus:ring-0 p-0 appearance-none cursor-pointer text-sm">
<option class="bg-surface-container" value="short">Short</option>
<option class="bg-surface-container" selected="" value="medium">Medium</option>
<option class="bg-surface-container" value="long">Detailed</option>
</select>
<span class="material-symbols-outlined text-outline absolute right-2 pointer-events-none text-sm">format_align_left</span>
</div>
</div>
</div>
</form>
<!-- Submit Button -->
<div class="mt-6 flex justify-center">
<button class="btn-glow animate-vibrate w-full max-w-[280px] py-4 rounded-full font-headline-lg-mobile text-headline-lg-mobile text-on-primary-fixed flex items-center justify-center gap-2 active:scale-95 transition-all duration-200" type="button">
<span>✨</span>
<span>Создать</span>
</button>
</div>
</main>
