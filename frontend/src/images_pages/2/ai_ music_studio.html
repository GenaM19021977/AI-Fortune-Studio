<style>
        body {
            background-color: #0A0A0F;
            color: #e4e1e9;
            overflow-x: hidden;
            position: relative;
        }
        
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% -20%, rgba(189, 0, 255, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at 100% 120%, rgba(0, 238, 252, 0.1) 0%, transparent 50%);
            animation: pulse-aurora 10s infinite alternate ease-in-out;
        }

        @keyframes pulse-aurora {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid transparent;
            border-image: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(255,255,255,0)) 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        .glass-pill {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .glow-btn:hover {
            box-shadow: 0 0 15px rgba(236, 178, 255, 0.4);
            transform: scale(0.98);
        }
        
        .glow-btn:active {
            transform: scale(0.95);
        }

        /* 3D Record specific */
        .record-container {
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        
        .record {
            transition: transform 0.1s ease;
            box-shadow: 0 20px 50px rgba(189, 0, 255, 0.2), 
                        inset 0 0 20px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .waveform {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            height: 60px;
        }
        
        .bar {
            width: 4px;
            background: linear-gradient(to top, #bd00ff, #00eefc);
            border-radius: 2px;
            transition: height 0.1s ease;
            opacity: 0.8;
        }
        
        /* Nav specific */
        .nav-indicator {
            content: '';
            width: 4px;
            height: 4px;
            background-color: theme('colors.primary');
            border-radius: 50%;
            margin-top: 4px;
            box-shadow: 0 0 8px rgba(236,178,255,0.8);

<script>
        // Waveform Generator
        const waveformContainer = document.getElementById('waveform');
        const numBars = 40;
        
        for(let i=0; i<numBars; i++) {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            // Initial random height
            bar.style.height = `${Math.random() * 100}%`;
            waveformContainer.appendChild(bar);
        }

        // Simulate waveform movement
        setInterval(() => {
            const bars = document.querySelectorAll('.bar');
            bars.forEach(bar => {
                // Keep the edges smaller to look like a typical visualizer
                const h = Math.random() * 100;
                bar.style.height = `${Math.max(10, h)}%`;
            });
        }, 150);

        // 3D Record Tilt Effect
        const record = document.querySelector('.record');
        const container = document.getElementById('albumArtContainer');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -15; // Max 15deg tilt
            const rotateY = ((x - centerX) / centerX) * 15;
            
            record.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            record.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
    </script>
