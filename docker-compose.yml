# AI Fortune Studio — локальная инфраструктура данных (шаг 0.2)
# Запуск:  docker compose up -d
# Статус:  docker compose ps
# Остановка: docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: fortune-db
    restart: unless-stopped
    ports:
      # 5433 на хосте — чтобы не конфликтовать с локальным PostgreSQL Windows (часто занимает 5432)
      - "5433:5432"
    environment:
      POSTGRES_USER: fortune
      POSTGRES_PASSWORD: fortune
      POSTGRES_DB: fortune
    volumes:
      - fortune_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortune -d fortune"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fortune-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fortune_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  fortune_pg_data:
  fortune_redis_data:
